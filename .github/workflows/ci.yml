name: OpenKatana release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install package and test dependencies
        run: python -m pip install '.[vision,mcp,text,hosted]' build
      - name: Explicit test-browser installation
        run: python -m playwright install --with-deps chromium
      - name: Select test browser
        shell: bash
        run: python -c "from playwright.sync_api import sync_playwright; import os; p=sync_playwright().start(); open(os.environ['GITHUB_ENV'],'a').write('OPENKATANA_CHROME='+p.chromium.executable_path+'\n'); p.stop()"
      - name: Contracts and regression tests
        run: python -m unittest discover -s tests -q
      - name: Verify source manifest and public paths
        run: python scripts/release_bundle.py --check-manifest
      - name: Render bundled photo and video edit
        run: python examples/quick-edit/render.py --width 320 --height 180
      - name: Render glyph and shutter fixtures
        run: python scripts/test_release_features.py --out work/release-features
      - name: Studio browser workflow
        run: python scripts/test_studio_live.py --out work/studio-check
      - name: Build distributions
        run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.os }}-${{ matrix.python }}
          path: |
            work/release-features/validation.json
            work/studio-check/result.json
            work/studio-check/*.png
            dist/*
